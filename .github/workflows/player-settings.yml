name: CrownFold player settings
on:
  push:
    branches: [feat/player-comfort-settings]
  pull_request:
permissions:
  contents: read
jobs:
  player-settings:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax, regression suite and offline artifact
        run: |
          npm run check
          npm test
          npm run build
          git diff --exit-code -- dist/
      - name: Install browser harness
        run: |
          python -m pip install playwright==1.62.0
          python -m playwright install --with-deps chromium
      - name: Test actual preferences UI and audio graph
        run: python tests/settings_browser.py
      - name: Stress last-page preference persistence with raw evidence
        run: python tests/settings_persistence_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crownfold-player-settings-evidence
          path: test-results/
