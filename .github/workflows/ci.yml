name: CrownFold gameplay
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  gameplay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set up pinned Rust toolchain
        run: rustup show
      - name: Rust format, lint, native tests and Wasm reproducibility
        run: |
          cargo fmt --manifest-path rust/Cargo.toml --check
          cargo clippy --manifest-path rust/Cargo.toml --all-targets -- -D warnings
          npm run test:rust
          npm run check:rust
      - name: Build, syntax and simulation regression suite
        run: |
          npm run build
          npm run check
          npm test
          git diff --exit-code -- dist/ src/rust-tactics-data.mjs
      - name: Install browser harness
        run: |
          python -m pip install playwright==1.62.0
          python -m playwright install --with-deps chromium
      - name: Served, offline and fallback gameplay smoke
        run: |
          npm start > /tmp/crownfold-server.log 2>&1 &
          for i in $(seq 1 30); do curl --fail http://127.0.0.1:3040/ >/dev/null 2>&1 && break; sleep 1; done
          python tests/rust_runtime_browser.py
          python tests/war_checkpoints_browser.py
          python tests/save_catalog_browser.py
      - name: Play six-weapon arsenal in offline and served builds
        run: |
          python tests/arsenal_browser.py
          cp test-results/arsenal-browser.json test-results/arsenal-offline.json
          CROWNFOLD_URL=http://127.0.0.1:3040/ python tests/arsenal_browser.py
          cp test-results/arsenal-browser.json test-results/arsenal-served.json
      - name: Play no-waste Forge in offline and served builds
        run: |
          python tests/crafting_browser.py
          cp test-results/crafting-browser.json test-results/crafting-offline.json
          CROWNFOLD_URL=http://127.0.0.1:3040/ python tests/crafting_browser.py
          cp test-results/crafting-browser.json test-results/crafting-served.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crownfold-gameplay-evidence
          path: test-results/
