name: CrownFold tactical controls
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  tactical-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require the committed offline artifact to match the build
        run: |
          npm run build
          git diff --exit-code -- dist/
      - name: Install pinned browser harness
        run: |
          python -m pip install playwright==1.62.0
          python -m playwright install --with-deps chromium
      - name: Exercise real keyboard, pointer and selection in the offline build
        run: python tests/war_tactical_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crownfold-tactical-controls-evidence
          path: test-results/
